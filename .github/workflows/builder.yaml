name: Build images

on:
  push:
    branches: [main]
    paths:
      - "brunata_fetcher/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: brunata-fetcher
  REGISTRY_PREFIX: ghcr.io/christophhornung

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the add-on version
        id: version
        run: |
          version=$(grep '^version:' brunata_fetcher/config.yaml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare the build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build and push the ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          context: brunata_fetcher
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
